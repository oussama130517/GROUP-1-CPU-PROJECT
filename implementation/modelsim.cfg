# ============================================================
#  MODELSIM SIMULATOR CONFIGURATION
#  File    : modelsim.cfg
#  Desc    : ModelSim compilation and simulation settings
# ============================================================

[modelsim]
# ModelSim Path and Version

modelsim_path = "/usr/local/questasim/bin"
version = "2021.4+"
license_file = "/usr/local/questasim/license.dat"

[compiler]
# Verilog Compiler Settings

# Compiler binary
compiler = "vlog"
compiler_full_path = "/usr/local/questasim/bin/vlog"

# Language standard
verilog_standard = "sv2017"     # verilog, sv2005, sv2012, sv2017
use_systemverilog = true

# Compiler flags
optimization_level = 2          # 0-3
warning_level = 3               # 0-4 (0=none, 4=most verbose)

compiler_flags =
    -sv_std sv2017
    -explicit
    -dpiheader
    +define+SIMULATION=1
    +define+DEBUG=0

# Include paths
include_paths =
    +incdir+./src
    +incdir+./include
    +incdir+./sim

# Library mapping
use_work_library = true
library_name = "work"
library_path = "./work"

# Source files
source_files =
    src/cpu_system.v
    src/cpu_top.v
    src/program_counter.v
    src/branch_logic.v
    src/flags_register.v
    src/sign_extend.v
    src/control_unit.v
    src/register.v
    src/alu.v
    src/instruction_memory.v
    src/data_memory.v

# Testbench files
testbench_files =
    sim/testbench.v
    sim/test_helpers.v

# Options
keep_comments = true
optimize = true

[simulator]
# ModelSim Simulator Settings

# Simulator binary
simulator = "vsim"
simulator_full_path = "/usr/local/questasim/bin/vsim"

# Simulation mode
mode = "batch"                  # batch, interactive, or gui
gui_enabled = false

# Top module
top_module = "CPU_SYSTEM"
testbench_module = "CPU_SYSTEM_TB"

# Simulation parameters
timescale = "1ns/1ps"
time_unit = "ns"
time_precision = "ps"
resolution = "1ps"

# Duration and timeout
duration = "1000 ns"
timeout = "10000 ns"
stop_on_error = true

# Simulation speed
speed = "fast"                  # fast, normal, slow
step_resolution = "1ps"

# Simulator options
simulator_flags =
    -c
    -quiet
    -do commands.do
    -l sim.log
    -wlf simulation.wlf

# Do file
do_file_enabled = true
do_file = "commands.do"

# Do file content
do_file_content = |
    # ModelSim Do File
    vsim -gui work.CPU_SYSTEM_TB
    add wave -noupdate /CPU_SYSTEM_TB/*
    wave zoom fit
    run 1000 ns
    exit

[waveform]
# Waveform Settings

# Format and file
format = "wlf"                  # wlf (ModelSim native)
output_file = "simulation.wlf"
vcd_export = true
vcd_file = "simulation.vcd"

# WLF options
wlf_compression = true
wlf_record_all_ports = true

# Signals to capture
capture_all = true
capture_signals =
    /CPU_SYSTEM_TB/*
    /CPU_SYSTEM_TB/u_cpu/*
    /CPU_SYSTEM_TB/u_imem/*
    /CPU_SYSTEM_TB/u_dmem/*

# Dump control
dump_start_time = "0 ns"
dump_stop_time = "1000 ns"

# Wave properties
wave_zoom_default = "fit"
wave_grid_enabled = true
wave_grid_period = "100 ns"

[assertions]
# Assertion & SVA Settings

enabled = true
assertion_enable = true
severity = "error"              # note, warning, error, failure

# Cover directives
cover_enabled = true
assert_abort = false

[profiling]
# Code and Power Analysis

# Code profiling
code_profiling = true
profile_file = "profile.txt"

# Power analysis
power_analysis = false
power_file = "power.txt"

# Memory profiling
memory_profiling = true

[debugging]
# Debugging Options

# Breakpoints
breakpoints_enabled = true
breakpoints = []
# breakpoints = ["@100ns", "when pc_current==32'h10"]

# Step execution
step_size = "1 ns"
single_step = false

# Variable tracking
track_variables =
    pc_current
    imem_data
    opcode
    rs1_data
    rs2_data
    alu_result
    dmem_rdata
    flags

# Watch windows
watch_windows = true
watch_items = []

# Trace display
trace_enabled = true
trace_depth = 10
trace_on_error = true

# Force/release signals
force_signal = false
force_values = []

[libraries]
# Library Configuration

# Default library
default_library = "work"

# Library paths
library_paths =
    work
    ./work

# Compiled libraries
use_compiled_libraries = true
compiled_lib_dir = "./work"

# Library mapping
library_mapping =
    ieee=/usr/local/questasim/ieee
    std=/usr/local/questasim/std

[coverage]
# Code Coverage Settings

enabled = true
coverage_file = "coverage.ucdb"
coverage_format = "ucdb"        # ucdb, text, or html

# Coverage types
code_coverage = true
line_coverage = true
branch_coverage = true
condition_coverage = true
expression_coverage = true
statement_coverage = true
toggle_coverage = true
fsm_coverage = true
assertion_coverage = true

# Coverage options
exclude_modules = ["*TB", "*_SIM"]
exclude_files = []
minimum_threshold = 80          # %

# Coverage report
generate_report = true
report_format = "html"
report_file = "coverage_report.html"

[logging]
# Log and Output Settings

# Log file
log_file = "modelsim.log"
log_level = "info"              # debug, info, warning, error, fatal

# Console output
console_output = true
transcript_enabled = true
transcript_file = "transcript"

# Message format
message_format = "[%TIME%] %LEVEL% - %MESSAGE%"
include_module_name = true
include_timestamp = true

# Log filters
show_internal = false
show_warnings = true
show_errors = true

[gui]
# GUI Settings (if gui_enabled = true)

# Window settings
window_title = "ModelSim - CPU_RISC Simulation"
window_width = 1400
window_height = 900

# Layout
default_layout = "default"
show_toolbar = true
show_statusbar = true

# Waveform viewer
waveform_viewer = "modelsim"
auto_update_wave = true
wave_refresh_rate = "100ms"

# Color scheme
color_theme = "dark"
font_size = 10

# Views
show_objects_pane = true
show_files_pane = true
show_log_pane = true

[environment]
# Environment Variables

# Paths
MODELSIM_PATH = "/usr/local/questasim"
SIM_DIR = "./sim"
SRC_DIR = "./src"
OUTPUT_DIR = "./output"
BUILD_DIR = "./build"
WORK_DIR = "./work"

# ModelSim specific
MTI_VL_RELEASE = "10.7"
LM_LICENSE_FILE = "/usr/local/questasim/license.dat"

# Custom variables
SIMULATION = "1"
MODELSIM_BATCH = "1"
DEBUG_LEVEL = "1"

[batch_mode]
# Batch Mode Settings

# Enable batch simulation
batch_enabled = true
batch_file = "batch_commands.do"

# Multiple run configurations
num_runs = 1

# Parameter sweeps
parameter_sweep = false
sweep_parameters = []

# Result collection
collect_results = true
results_file = "results.txt"

[performance]
# Performance Optimization

# Simulator optimization
turbo_mode = true
incremental_compile = true

# Memory optimization
optimize_memory = true
shared_libraries = true

# Execution speed
parallel_execution = false
num_threads = 4

[callbacks]
# Custom Callbacks

# Initialization
init_script = "scripts/init.do"
init_delay = "0 ns"

# Runtime
runtime_script = ""

# Post-simulation
post_sim_script = "scripts/post_sim.do"
post_sim_delay = "0 ns"

[constraints]
# Timing Constraints

# Clock definition
clock_name = "clk"
clock_period = "10 ns"          # 100 MHz
clock_duty = "50%"
clock_jitter = "0 ps"

# Reset definition
reset_name = "rst"
reset_active_level = "1"
reset_duration = "100 ns"

# Timing paths
false_paths = []
multicycle_paths = []
max_delay_paths = []

[advanced]
# Advanced Settings

# Elaboration
elaborate_during_parse = false
optimized_elaboration = true

# Simulation kernel
vhdl_kernel = false
verilog_kernel = true
mixed_kernel = false

# Variable reference
reference_counting = true
memory_management = "auto"

# Callback handling
callback_delay = "0 ns"
callback_queue_size = 10000

# Numerical precision
floating_point_precision = 17

[commands]
# Common Commands

# Compilation
compile = "vlog -sv_std sv2017 src/*.v sim/*.v"

# Elaboration
elaborate = "vsim -c -do 'run 1000ns; exit' work.CPU_SYSTEM_TB"

# Full simulation
run_sim = "vsim -c -do commands.do work.CPU_SYSTEM_TB"

# GUI mode
run_gui = "vsim -gui work.CPU_SYSTEM_TB"

# Clean workspace
clean = "rm -rf work *.ucdb *.wlf transcript"

# Generate coverage report
coverage_report = "coverage report -assert -detail -output coverage_report.txt work.tb"
