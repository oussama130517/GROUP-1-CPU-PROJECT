# ============================================================
#  GENERAL VERILOG CONFIGURATION
#  File    : verilog.cfg
#  Desc    : Common Verilog compilation and simulation settings
# ============================================================

[general]
# General Settings

project_name = "32-Bit RISC Processor"
project_version = "1.0.0"
language = "Verilog"
verilog_standard = "IEEE 1364-2005"
systemverilog_support = true

# Time settings
timescale = "1ns/1ps"
default_clock_period = "10 ns"
default_reset_duration = "100 ns"

[paths]
# Directory Paths

root_dir = "./"
source_dir = "./src"
simulation_dir = "./sim"
synthesis_dir = "./synth"
testbench_dir = "./sim"
include_dir = "./include"
output_dir = "./output"
build_dir = "./build"
reports_dir = "./reports"
constraints_dir = "./constraints"
scripts_dir = "./scripts"
documentation_dir = "./docs"

[source_files]
# Source File List

# Core modules
core_modules =
    src/cpu_system.v
    src/cpu_top.v
    src/program_counter.v
    src/branch_logic.v
    src/flags_register.v
    src/sign_extend.v
    src/control_unit.v
    src/register.v
    src/alu.v
    src/instruction_memory.v
    src/data_memory.v

# Testbench files
testbench_files =
    sim/testbench.v
    sim/test_helpers.v

# Include files
include_files =
    include/parameters.vh
    include/opcodes.vh
    include/macros.vh

[compilation]
# Compilation Settings

# Compiler selection
preferred_compiler = "iverilog"  # iverilog, modelsim, vivado, or quartus
fallback_compiler = "modelsim"

# Standard library
use_ieee_library = true
use_std_library = true

# Compilation flags - Common
common_flags =
    -timescale 1ns/1ps
    -Wall
    -Winfloop

# Preprocessor defines
global_defines =
    SIMULATION=1
    DEBUG_LEVEL=0
    TRACE_ENABLED=0

# Include directories
include_directories =
    ./include
    ./src
    ./sim

# Library compilation
compile_library = true
library_name = "work"
library_compile_order = "dependency"

# Optimization
optimize_for = "simulation"     # simulation, synthesis, or balanced
optimization_level = 2          # 0-3

[modules]
# Module Configuration

# Top-level module
top_module = "CPU_SYSTEM"
top_module_file = "src/cpu_system.v"

# Testbench module
testbench_module = "CPU_SYSTEM_TB"
testbench_file = "sim/testbench.v"

# Instantiation hierarchy
module_hierarchy =
    CPU_SYSTEM:
        - CPU_TOP
        - INSTRUCTION_MEMORY
        - DATA_MEMORY

[simulation]
# Simulation Settings

# Simulation type
simulation_type = "behavioral"   # behavioral, gate_level, or timing

# Run parameters
simulation_duration = "1000 ns"
simulation_timeout = "10000 ns"
stop_on_error = true
stop_on_assertion = false

# Clock generation
clock_generation = true
clock_period = "10 ns"
clock_duty_cycle = "50%"
clock_phase = "0 ns"
clock_jitter = "0 ps"

# Reset generation
reset_generation = true
reset_type = "asynchronous"      # asynchronous or synchronous
reset_active_level = "high"      # high or low
reset_assert_time = "0 ns"
reset_release_time = "100 ns"
reset_duration = "100 ns"

# Initial conditions
initialize_registers = true
initialize_memory = true
init_value_default = "32'h0"

[waveform]
# Waveform & Trace Settings

# Waveform generation
generate_waveform = true
waveform_format = "vcd"         # vcd, lxt, lxt2, fst, or wlf
waveform_file = "simulation.vcd"
waveform_compression = false

# Scope configuration
waveform_scope = "CPU_SYSTEM"
capture_all_signals = true

# Selected signals (if capture_all_signals = false)
waveform_signals =
    CPU_SYSTEM.clk
    CPU_SYSTEM.rst
    CPU_SYSTEM.CPU_TOP.*
    CPU_SYSTEM.u_imem.*
    CPU_SYSTEM.u_dmem.*

# Dump control
dump_enabled = true
dump_start_time = "0 ns"
dump_stop_time = "1000 ns"
dump_scope_levels = "all"       # all, or number

# Variable formats
variable_format = "default"      # default, binary, hex, or decimal
time_format = "scientific"      # fixed, scientific, or auto

[debugging]
# Debugging Settings

# Debug level
debug_enabled = true
debug_level = "info"            # none, error, warning, info, debug

# Trace settings
trace_enabled = true
trace_depth = 10
trace_output_file = "trace.txt"

# Assertion checking
assertion_enabled = true
assertion_severity = "error"    # note, warning, error, or failure

# Coverage analysis
coverage_enabled = true
coverage_type = "code"          # code, functional, or both
coverage_file = "coverage.txt"

# Breakpoints
breakpoint_support = true

# Variable inspection
variable_inspection = true
max_inspect_depth = 10

[constraints]
# Constraint Settings

# Timing constraints
timing_constraint_file = "constraints/timing.xdc"

# Clock constraints
clock_constraint =
    name = "clk"
    period = "10 ns"
    duty_cycle = "50%"
    skew = "0.5 ns"

# IO constraints
io_constraint_file = "constraints/io.xdc"

# Power constraints
power_constraint_file = ""
max_power = "500 mW"

[performance]
# Performance Settings

# Code execution speed
optimize_for_speed = false
use_parallel_execution = false
num_parallel_threads = 4

# Memory management
memory_optimization = true
enable_caching = true

# Simulation speed settings
simulation_mode = "fast"        # fast, normal, or slow
incremental_compilation = true

[error_handling]
# Error Handling Settings

# Error reporting
report_errors = true
report_warnings = true
report_notes = true

# Severity levels
error_severity = "error"
warning_severity = "warning"
note_severity = "note"

# Error output
error_log_file = "errors.log"
error_output_console = true

# Abort conditions
abort_on_error = false
abort_on_warning = false
max_errors = 100

[output_files]
# Output File Configuration

# Generated files
simulation_log = "simulation.log"
elaboration_log = "elaborate.log"
synthesis_log = "synthesis.log"

# Report generation
generate_reports = true
report_format = "text"          # text, html, or json

# Report types
reports =
    - simulation_summary
    - coverage_report
    - timing_report
    - resource_report

[macros]
# Macro Definitions

# Parameter macros
WORD_WIDTH = 32
ADDR_WIDTH = 32
REG_COUNT = 8
IMEM_SIZE = 256
DMEM_SIZE = 256

# Functional macros
ENABLE_DEBUG = 1
ENABLE_TRACE = 0
ENABLE_COVERAGE = 1

[post_simulation]
# Post-Simulation Actions

# Analysis
run_analysis = false
analysis_script = "scripts/analyze.py"

# Report generation
generate_final_report = true
final_report_file = "final_report.txt"

# Cleanup
cleanup_temp_files = true
archive_outputs = false
archive_format = "tar.gz"

# Notifications
enable_notifications = false
notification_type = "email"      # email, webhook, or log

[environment]
# Environment Variables

# Tool paths
VERILOG_COMPILER = "iverilog"
VERILOG_SIM = "vvp"

# Directory environment
SIM_DIR = "./sim"
SRC_DIR = "./src"
OUTPUT_DIR = "./output"
BUILD_DIR = "./build"
REPORTS_DIR = "./reports"

# Compiler environment
VERILOG_INCLUDE_PATH = "./include:./src"
VERILOG_LIBRARY_PATH = "./work"

# Custom environment variables
SIMULATION = "1"
DEBUG = "0"
VERBOSE = "0"

[tools]
# Tool Configuration

# Available tools
tools =
    iverilog:
        path = "/usr/bin/iverilog"
        version = "10.0+"
        enabled = true
    
    modelsim:
        path = "/usr/local/questasim/bin"
        version = "2021.4+"
        enabled = true
    
    vivado:
        path = "/opt/Xilinx/Vivado/2021.2/bin"
        version = "2021.2+"
        enabled = false
    
    quartus:
        path = "/opt/intelFPGA/quartus/bin"
        version = "21.1+"
        enabled = false

# Default tool
default_tool = "iverilog"

[templates]
# Template Configurations

# Testbench template
testbench_template = "templates/testbench_template.v"

# Module template
module_template = "templates/module_template.v"

# Report template
report_template = "templates/report_template.txt"

[validation]
# Design Validation

# Linting
lint_enabled = true
lint_tool = "verilator"
lint_warnings = true
lint_errors = true

# Formal verification
formal_verification = false
formal_tool = ""

# Post-synthesis
post_synthesis_check = true
check_timing = true
check_resources = true

[documentation]
# Documentation Settings

# API documentation
generate_api_docs = true
api_doc_format = "markdown"
api_doc_output = "./docs/api"

# Code comments
require_comments = false
comment_style = "///"            # //, ///, or /**/

# Generate README
auto_generate_readme = false

[version_control]
# Version Control Integration

# Git settings
git_enabled = true
git_auto_commit = false
git_commit_message = "Auto-commit from simulation"

# Version tracking
track_versions = true
version_file = "VERSION"

[advanced]
# Advanced Settings

# IEEE compliance
strict_ieee = true
ieee_1800_2017 = false

# Optimization techniques
constant_folding = true
dead_code_elimination = true
expression_optimization = true

# Advanced simulation
event_driven = true
delta_cycles = true
race_condition_detection = false

# Memory model
memory_model = "unified"        # unified or distributed
cache_optimization = false

[settings_note]
# NOTE
# This configuration file can be used across different tools
# by selecting appropriate sections. Each tool's documentation
# explains which settings are relevant and how to interpret them.
#
# To use this file:
# 1. Set your preferred tool in [tools] section
# 2. Configure tool-specific settings
# 3. Set paths appropriate for your system
# 4. Verify simulation settings match your requirements
# 5. Run simulation with: make sim (or ./run_sim.sh)
