# ============================================================
#  IVERILOG SIMULATOR CONFIGURATION
#  File    : iverilog.cfg
#  Desc    : iVerilog compiler and simulator settings
# ============================================================

[compiler]
# iVerilog Compiler Settings

# Version and standard
version = "10.0+"
standard = "verilog-2005"
ieee_standard = "IEEE 1364-2005"

# Compilation mode
mode = "vvp"                    # vvp or interactive

# Output file
output_file = "cpu_sim.vvp"
output_dir = "build/simulation"

# Preprocessor settings
preprocessor_defines =
    SIMULATION=1
    SIM_TIME=1000000
    DEBUG_LEVEL=1

include_directories =
    ./src
    ./include
    ./sim

# Optimization flags
optimization_level = 2          # 0-3 (0=none, 3=maximum)
optimization_flags =
    -O2
    -O3

# Warning flags
warning_level = "all"           # none, some, all
warning_flags =
    -Wall
    -Winfloop
    -Wovl
    -Wtimescale

# Debug settings
debug_mode = true
debug_symbols = "-g"
debug_verbose = false

# File list
input_files =
    src/cpu_system.v
    src/cpu_top.v
    src/program_counter.v
    src/branch_logic.v
    src/flags_register.v
    src/sign_extend.v
    src/control_unit.v
    src/register.v
    src/alu.v
    src/instruction_memory.v
    src/data_memory.v

testbench_files =
    sim/testbench.v
    sim/test_helpers.v

# Additional compiler options
extra_flags = "-Wall -Winfloop"

[simulator]
# VVP Runtime Settings

executable = "vvp"
executable_path = "/usr/bin/vvp"

# Simulation parameters
timescale = "1ns/1ps"
time_unit = "ns"
time_precision = "ps"

# Run settings
duration = "1000 ns"
timeout = "10000 ns"
stop_on_error = true

# Module instantiation
top_module = "CPU_SYSTEM"
testbench_module = "CPU_SYSTEM_TB"

# Simulation speed
simulation_speed = "fast"       # fast, normal, slow
step_resolution = "1ps"

[waveform]
# Waveform Output Settings

# Enable/disable waveform dumping
enabled = true
format = "vcd"                  # vcd, lxt, lxt2, fst
file = "simulation.vcd"
compress = false

# VCD options
vcd_scope_map = false
vcd_scope_sep = "."

# Signals to capture (hierarchical)
capture_signals =
    CPU_SYSTEM
    CPU_SYSTEM.CPU_TOP
    CPU_SYSTEM.CPU_TOP.u_pc
    CPU_SYSTEM.CPU_TOP.u_alu
    CPU_SYSTEM.CPU_TOP.u_regfile
    CPU_SYSTEM.u_imem
    CPU_SYSTEM.u_dmem

# Dump control
dump_start_time = "0 ns"
dump_stop_time = "1000 ns"
dump_variables = true

# Sample rate
sample_rate = "1 ns"
variable_decimation = 1

[memory]
# Memory Settings

# Stack and heap
stack_size = "1M"
heap_size = "10M"

# Memory file loading
preload_imem = false
imem_file = "program.hex"
imem_format = "hex"

preload_dmem = false
dmem_file = "data.hex"
dmem_format = "hex"

[assertions]
# Assertion Checking

enabled = true
severity_level = "error"        # note, warning, error
stop_on_assertion = false

# Assertion types
immediate_assertions = true
concurrent_assertions = true
property_assertions = true

[profiling]
# Performance Profiling

enabled = false
profile_file = "profile.txt"

# What to profile
profile_functions = true
profile_statements = true
profile_memory = true

# Output format
output_format = "text"          # text, json, csv

[debugging]
# Debugging Options

# Breakpoints
breakpoints = []                # List of breakpoints
# Example: breakpoints = ["@100000ps", "when pc_current==32'h10"]

# Watchpoints
watchpoints = []
# Example: watchpoints = ["pc_current", "alu_result"]

# Variable tracking
track_variables =
    pc_current
    imem_data
    opcode
    rs1_data
    rs2_data
    alu_result
    dmem_rdata
    n_flag
    z_flag
    c_flag
    v_flag

# Trace depth (stack trace)
trace_depth = 10
trace_on_error = true

[logging]
# Logging and Output

# Log file
log_file = "iverilog.log"
log_level = "info"              # debug, info, warning, error

# Console output
console_output = true
verbose_mode = false

# Message format
message_format = "[%TIME%] %LEVEL% - %MODULE%: %MESSAGE%"
include_timestamp = true

# Log filters
filter_modules = []             # Only log these modules
exclude_modules = []            # Don't log these modules

[constraints]
# Timing Constraints

# Clock constraints
clock_name = "clk"
clock_period = "10 ns"
clock_duty_cycle = "50%"

# Reset constraints
reset_name = "rst"
reset_active_level = "high"
reset_duration = "100 ns"

# Timing paths
ignore_timing = false

[coverage]
# Code Coverage Settings

enabled = true
coverage_file = "coverage.txt"

# Coverage types
code_coverage = true            # Lines and branches
statement_coverage = true
branch_coverage = true
toggle_coverage = true

# Exclude from coverage
exclude_modules = []
exclude_patterns = ["*_TB", "*SIM*"]

# Coverage threshold
threshold_minimum = 80          # %

[environment]
# Environment Variables

# Tool paths
IVERILOG_PATH = "/usr/bin/iverilog"
VVP_PATH = "/usr/bin/vvp"

# Directory paths
SIM_DIR = "./sim"
SRC_DIR = "./src"
OUTPUT_DIR = "./output"
BUILD_DIR = "./build"
REPORTS_DIR = "./reports"

# Custom variables
SIMULATION = "1"
DEBUG = "0"
TRACE = "0"

[parallel_execution]
# Parallel Execution Settings

enabled = false
num_threads = 4
max_jobs = 4

[performance]
# Performance Optimization

# Memory optimization
optimize_memory = true
memory_pooling = true

# Execution optimization
optimize_execution = true
inline_functions = true

# Caching
enable_caching = true
cache_size = "100M"

[post_simulation]
# Post-Simulation Actions

# Analysis scripts
analysis_scripts =
    sim/analyze.py
    sim/report.py

# Cleanup
cleanup_temp_files = true
archive_reports = false

# Notifications
send_email = false
email_recipients = []

[commands]
# Command Aliases

# Compilation
compile = "iverilog -g2009 -Wall -o build/simulation/cpu_sim.vvp src/*.v sim/*.v"

# Simulation
simulate = "vvp build/simulation/cpu_sim.vvp"

# Full flow
run = "compile && simulate"

# Wave analysis
wave = "gtkwave simulation.vcd &"

# Clean
clean = "rm -rf build/* *.vvp *.vcd"
