# ============================================================
#  SYNTHESIS CONFIGURATION
#  File    : synthesis.cfg
#  Desc    : FPGA/ASIC synthesis tool settings
# ============================================================

[general]
# General Synthesis Settings

project_name = "CPU_RISC_Synthesis"
version = "1.0.0"

# Design specifications
design_type = "FPGA"            # FPGA or ASIC
target_frequency = "100 MHz"
clock_period = "10 ns"

# Output format
output_format = "netlist"
netlist_format = "edf"          # edf, v, vhdl

[vivado]
# Xilinx Vivado Synthesis Settings

enabled = true
tool_path = "/opt/Xilinx/Vivado/2021.2/bin"
version = "2021.2"

# Project settings
project_file = "cpu_risc.xpr"
project_language = "Verilog"

# FPGA target
device = "xc7a35tcsg324-1"
device_family = "Artix-7"
package = "csg324"
speed_grade = "-1"

# Synthesis settings
synth_tool = "vivado"
synth_design_name = "cpu_risc"

synth_flags =
    -mode out_of_context
    -retiming
    -fsm_extraction one_hot
    -resource_sharing on
    -cascade_dsp yes
    -part xc7a35tcsg324-1

# Synthesis directives
synth_directive = "SynthesisStrategyViviado"
optimization_strategy = "Performance_Explore"

# Implementation settings
impl_directive = "Performance_Explore"
place_design_flags = "-directive Performance_Explore"
route_design_flags = "-directive Performance_Explore"

# Timing settings
timing_driven = true
phys_opt = true
phys_opt_directive = "Performance_Explore"

# Power management
power_optimization = true
clock_gating = true

# Output files
output_netlist = "cpu_risc_synth.edf"
output_xdc = "cpu_risc_synth.xdc"
output_edif = "cpu_risc.edif"

# Reports
generate_timing_report = true
timing_report_file = "timing_summary.txt"
generate_utilization_report = true
util_report_file = "utilization.txt"

[quartus]
# Intel Quartus Synthesis Settings

enabled = true
tool_path = "/opt/intelFPGA/quartus/bin"
version = "21.1"

# Project settings
project_file = "cpu_risc.qpf"
revision_name = "cpu_risc"

# FPGA target
device_family = "MAX10"
device = "10M50DAF484C6G"

# Synthesis settings
synth_tool = "quartus"
family = "MAX10"

synth_flags =
    --synthesis_effort fast
    --optimization=balanced

# Fitter settings
fitter_effort = "standard"

# Output files
output_netlist = "cpu_risc_synth.v"
output_qxp = "cpu_risc.qxp"

# Reports
generate_reports = true

[vivado_flow]
# Vivado Complete Flow

# Steps
steps =
    1. Read netlist
    2. Read constraints
    3. Synth design
    4. Opt design
    5. Place design
    6. Phys opt
    7. Route design
    8. Write bitstream

# Tcl script
tcl_script = "scripts/vivado_synth.tcl"

tcl_content = |
    # Create project
    create_project -force cpu_risc ./vivado -part xc7a35tcsg324-1
    
    # Add source files
    add_files ./src/*.v
    add_files -fileset sim_1 ./sim/testbench.v
    
    # Add constraints
    add_files -fileset constrs_1 ./constraints/timing.xdc
    
    # Set top module
    set_property top cpu_system [current_fileset]
    
    # Run synthesis
    launch_runs synth_1
    wait_on_run synth_1
    
    # Open synthesized design
    open_run synth_1
    
    # Generate reports
    report_timing_summary -file timing_summary.txt
    report_utilization -file utilization.txt

[quartus_flow]
# Quartus Complete Flow

# Tcl script
tcl_script = "scripts/quartus_synth.tcl"

[yosys]
# Yosys (Open Source) Synthesis

enabled = true
tool_path = "/usr/bin/yosys"
version = "0.9+"

# Yosys script
yosys_script = "scripts/yosys_synth.ys"

script_content = |
    # Read Verilog files
    read_verilog src/cpu_system.v
    read_verilog src/cpu_top.v
    read_verilog src/program_counter.v
    read_verilog src/branch_logic.v
    read_verilog src/flags_register.v
    read_verilog src/sign_extend.v
    read_verilog src/control_unit.v
    read_verilog src/register.v
    read_verilog src/alu.v
    read_verilog src/instruction_memory.v
    read_verilog src/data_memory.v
    
    # Hierarchy and proc
    hierarchy -top cpu_system
    proc
    
    # Optimization
    opt
    fsm
    opt -full
    
    # Mapping
    techmap
    opt
    
    # Output
    write_json build/cpu.json
    write_verilog build/cpu_synth.v
    write_eblif build/cpu.eblif

[input_files]
# Input Files for Synthesis

# Verilog source files
source_files =
    src/cpu_system.v
    src/cpu_top.v
    src/program_counter.v
    src/branch_logic.v
    src/flags_register.v
    src/sign_extend.v
    src/control_unit.v
    src/register.v
    src/alu.v
    src/instruction_memory.v
    src/data_memory.v

# Constraint files
constraint_files =
    constraints/timing.xdc
    constraints/io.xdc
    constraints/placement.xdc

# Memory files
memory_files = []

[constraints]
# Timing and Design Constraints

# Clock constraints
clock_name = "clk"
clock_period = "10 ns"          # 100 MHz
clock_duty = "50%"
clock_uncertainty = "0.5 ns"
clock_jitter = "0.1 ns"

# Reset constraint
reset_name = "rst"
reset_period = "100 ns"

# Input delay
input_delay_from_clock = "3 ns"
input_delay_uncertainty = "0.5 ns"

# Output delay
output_delay_to_clock = "2 ns"
output_delay_uncertainty = "0.5 ns"

# False paths
false_paths = []

# Multicycle paths
multicycle_paths = []

# Max delay
max_delay_constraints = []

[optimization]
# Synthesis Optimization Settings

# Area optimization
area_optimization = false
area_recovery = false
area_mode = 0               # 0-3

# Speed optimization
speed_optimization = true
timing_mode = 1             # 0-2
target_frequency = "100 MHz"

# Power optimization
power_optimization = true
power_mode = 1              # 0-2

# Resource optimization
use_dsp = true
use_bram = true
cascaded_dsp = true

# Logic optimization
resource_sharing = true
register_duplication = false
constant_folding = true
unused_removal = true

[rtl]
# RTL Settings

# RTL optimization
rtl_optimization = true
flatten_hierarchy = false

# Ramification
hier_mode = "rebuilt"       # rebuilt or preserved

# FSM encoding
fsm_encoding = "one_hot"    # one_hot, binary, gray, or johnson
fsm_style = "lut"          # lut or bram

[placement]
# Placement Settings

placement_algorithm = "greedy"   # greedy, optimal, or fast
placer_effort = "high"          # low, medium, or high

# Floorplanning
floorplan_file = ""

# Region constraints
region_constraints = []

[routing]
# Routing Settings

routing_algorithm = "pathfinder"
router_effort = "high"          # low, medium, or high

# Timing driven routing
timing_driven_routing = true
timing_grade = 1                # 0-3

# Congestion
avoid_congestion = true
use_local_routing = true

[output]
# Output Files

output_directory = "./build/synthesis"

# Netlist output
netlist_file = "cpu_synth.edf"
netlist_format = "edf"          # edf, v, vhdl, or blif

# Reports
reports =
    - timing_summary.txt
    - utilization.txt
    - power_summary.txt
    - area_summary.txt
    - drc_report.txt

# Logs
log_files =
    - synthesis.log
    - place_route.log
    - timing.log

[post_synthesis]
# Post-Synthesis Actions

# Gate-level simulation
generate_gate_netlist = true
gate_netlist_file = "cpu_gate_sim.v"

# SDF generation
generate_sdf = true
sdf_file = "cpu.sdf"

# SPEF generation
generate_spef = false
spef_file = ""

# DCP (Vivado) checkpoint
generate_dcp = true
dcp_file = "cpu_synth.dcp"

[verification]
# Post-Synthesis Verification

# Formal verification
formal_check = false
formal_tool = ""

# Gate-level simulation
gate_sim_enabled = false
gate_sim_testbench = "sim/gate_sim_tb.v"

# Lint checking
lint_enabled = true

[power_analysis]
# Power Analysis

enabled = true
power_tool = "vivado"

# Power settings
power_estimate = true
power_file = "power_summary.txt"

# Switching activity
activity_file = ""
default_activity = 0.1          # 10%

# Temperature
operating_temperature = 25      # Celsius
junction_temperature_limit = 75 # Celsius

[timing_analysis]
# Timing Analysis

enabled = true
static_timing_analysis = true

# Slack reporting
report_slack = true
min_slack_threshold = "0 ns"

# Critical path
report_critical_path = true
max_critical_paths = 10

# Setup/hold
report_setup = true
report_hold = true

[resource_usage]
# Resource Utilization Reporting

report_lut_usage = true
report_bram_usage = true
report_dsp_usage = true
report_io_usage = true

[scripting]
# Script Integration

# Pre-synthesis script
pre_synth_script = "scripts/pre_synth.tcl"
pre_synth_enabled = false

# Post-synthesis script
post_synth_script = "scripts/post_synth.tcl"
post_synth_enabled = true

# Post-P&R script
post_pr_script = "scripts/post_pr.tcl"
post_pr_enabled = true

[environment]
# Environment Variables

XILINX = "/opt/Xilinx"
VIVADO = "/opt/Xilinx/Vivado/2021.2"
QUARTUS_ROOTDIR = "/opt/intelFPGA/quartus"
YOSYS_PATH = "/usr/bin/yosys"

[documentation]
# Documentation Generation

generate_synthesis_report = true
synthesis_report_format = "html"
synthesis_report_file = "synthesis_report.html"

# Detailed analysis
include_detailed_analysis = true
include_constraint_analysis = true
include_timing_analysis = true
